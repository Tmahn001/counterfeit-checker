# Python-side hooks (run alongside husky/lint-staged for the JS side).
# Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(apps/api|ml)/
      - id: ruff-format
        files: ^(apps/api|ml)/
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^(apps/api|ml)/
