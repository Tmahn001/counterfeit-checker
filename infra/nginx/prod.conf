# Serves the static Next.js export and proxies /api/ to Django.
# Headers here enforce the PWA/security posture from the implementation plan (Section 13).
map $sent_http_content_type $cache_policy {
    default                     "public, max-age=3600";
    "application/octet-stream"  "public, max-age=31536000, immutable";  # model shards are content-addressed by version dir
    "application/wasm"          "public, max-age=31536000, immutable";
    "text/html"                 "no-cache";
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
        text/html html;
        application/javascript js;
        text/css css;
        application/json json;
        application/octet-stream bin;
        image/png png;
        image/svg+xml svg;
        font/woff2 woff2;
    }

    add_header Cache-Control $cache_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Strict CSP: everything is bundled locally — no CDN origins are allowlisted. 'unsafe-inline' for scripts is
    # required by Next.js's inline bootstrap (RSC payload) scripts in a static export; everything else stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    # Worker scripts: a dedicated worker's CSP comes from its own script response; the WebAssembly
    # backend (Safari) needs 'unsafe-eval' there. The page policy above stays without it.
    location /_next/static/chunks/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'" always;
    }

    location /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200m;
    }
    location /django-admin/ {
        proxy_pass http://api:8000/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /django-static/ { alias /usr/share/nginx/django-static/; }

    error_page 404 /404.html;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
