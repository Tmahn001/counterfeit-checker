# HTTPS front door for LAN device testing (camera + service workers need a secure context off-localhost).
# Certificates come from infra/nginx/certs/ (generated by `make https`; use mkcert for a trusted one).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin "";  # dev only, see /django-admin/ below (same-origin through this proxy)
    }
    location /django-admin/ {
        proxy_pass http://api:8000/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Dev only: the LAN IP changes per network, so it cannot be listed in CSRF_TRUSTED_ORIGINS.
        # Dropping Origin makes Django fall back to its CSRF token check alone.
        proxy_set_header Origin "";
    }
    location /django-static/ {
        proxy_pass http://api:8000/django-static/;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
