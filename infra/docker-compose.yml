# Development stack. Bring up with `docker compose up` from the repo root (root compose.yaml includes this file).
#
# Services
#   db      PostgreSQL 15 (telemetry, OEM accounts, model registry)
#   redis   Celery broker/result backend
#   api     Django 4.2 + DRF administrative backend (NO role in the inference path)
#   worker  Celery worker (baseline embedding jobs; includes the ml package + TensorFlow)
#   web     Next.js 14 PWA dev server (client-side edge environment)
#   ml      Training / conversion / evaluation toolbox (profile: ml) — run on demand
#   nginx   HTTPS front door for LAN device testing (profile: https)
#   e2e     Playwright end-to-end runner (profile: e2e)
name: authentic-edge

x-api-env: &api-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
  DATABASE_URL: ${DATABASE_URL:-postgres://authentic_edge:authentic_edge_dev_only@db:5432/authentic_edge}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,https://localhost}
  SENTRY_DSN: ${SENTRY_DSN:-}
  DEV_SUPERUSER_EMAIL: ${DEV_SUPERUSER_EMAIL:-admin@example.com}
  DEV_SUPERUSER_PASSWORD: ${DEV_SUPERUSER_PASSWORD:-admin12345}
  DEV_OEM_EMAIL: ${DEV_OEM_EMAIL:-oem@example.com}
  DEV_OEM_PASSWORD: ${DEV_OEM_PASSWORD:-oem12345}
  DEV_NAFDAC_EMAIL: ${DEV_NAFDAC_EMAIL:-nafdac@example.com}
  DEV_NAFDAC_PASSWORD: ${DEV_NAFDAC_PASSWORD:-nafdac12345}
  PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authentic_edge}
      POSTGRES_USER: ${POSTGRES_USER:-authentic_edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authentic_edge_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: authentic-edge/api:dev
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    environment: *api-env
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py seed_dev
      && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../apps/api:/app
      - api_media:/app/media
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/api/v1/health/\").status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    image: authentic-edge/worker:dev
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: worker
    environment:
      <<: *api-env
      TF_CPP_MIN_LOG_LEVEL: '2'
      # Dev: import the bind-mounted ML source ahead of the copy baked into the image.
      PYTHONPATH: /ml/src
    command: celery -A config worker --loglevel=INFO --concurrency=1
    volumes:
      - ../apps/api:/app
      - ../ml:/ml
      - api_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: authentic-edge/web:dev
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_MODEL_MANIFEST_URL: ${NEXT_PUBLIC_MODEL_MANIFEST_URL:-/models/v1/model.json}
      NEXT_PUBLIC_BASELINES_URL: ${NEXT_PUBLIC_BASELINES_URL:-/baselines/v1/baselines.json}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      WATCHPACK_POLLING: 'true'
    command: pnpm --filter @authentic-edge/web dev
    volumes:
      - ..:/repo
      - web_node_modules:/repo/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
      - web_next_cache:/repo/apps/web/.next
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started

  ml:
    profiles: ['ml']
    image: authentic-edge/ml:dev
    build:
      context: ..
      dockerfile: ml/Dockerfile
    environment:
      TF_CPP_MIN_LOG_LEVEL: '2'
      MLFLOW_TRACKING_URI: file:///ml/mlruns
      PYTHONUNBUFFERED: '1'
    volumes:
      - ../ml:/ml
      - ../apps/web/public/models:/out/models
      - ../apps/web/public/baselines:/out/baselines
      - ../docs:/out/docs
    working_dir: /ml
    command: ['python', '-m', 'authentic_edge_ml.cli', '--help']

  nginx:
    profiles: ['https']
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - '443:443'
    depends_on:
      - web
      - api

  e2e:
    profiles: ['e2e']
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /repo/apps/web
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
      CI: 'true'
    volumes:
      - ..:/repo
      - e2e_node_modules:/repo/node_modules
      - e2e_app_node_modules:/repo/apps/web/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright test"
    depends_on:
      - web

volumes:
  pgdata:
  api_media:
  web_node_modules:
  web_app_node_modules:
  web_next_cache:
  e2e_node_modules:
  e2e_app_node_modules:
